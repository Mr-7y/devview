[package]
name = "ai-view"
version = "1.3.1"
edition = "2021"
description = "极简代码浏览器"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
dunce = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "windows")'.dependencies]
# common-controls-v6 让 Windows 用现代文件对话框，不加会退回 Win98 那种老样式
rfd = { version = "0.14", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.14", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
